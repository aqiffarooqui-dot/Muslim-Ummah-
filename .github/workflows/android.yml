          openssl req -new -x509 -key debug-key.pem -out debug-cert.pem -days 3650 \
            -subj "/CN=Android Debug/O=Android/C=US"
          openssl pkcs12 -export -out debug.p12 -inkey debug-key.pem -in debug-cert.pem \
            -name androiddebugkey -passout pass:android
          keytool -importkeystore -noprompt \
            -srckeystore debug.p12 -srcstoretype PKCS12 -srcstorepass android \
            -destkeystore debug.keystore -deststoretype JKS -deststorepass android \
            -destkeypass android -alias androiddebugkey
          echo "debug.keystore ready."
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -m1 "SHA1:"

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify Generated APK
        run: |
          echo "Generated APK files:"
          ls -lh app/build/outputs/apk/debug/

      - name: Upload Debug APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MuslimPro-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Check for Release Signing Secrets
        id: check_release
        run: |
          if [ -n "${{ secrets.STORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "has_release_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_release_secrets=false" >> $GITHUB_OUTPUT
            echo "Release secrets not provided. Skipping release signing."
          fi

      - name: Build Release APK (if secrets provided)
        if: steps.check_release.outputs.has_release_secrets == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            export KEYSTORE_PATH="$(pwd)/my-upload-key.jks"
          fi
          ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK to GitHub Artifacts
        if: steps.check_release.outputs.has_release_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MuslimPro-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases (on tag or manual trigger)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}
          name: Muslim Ummah ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
